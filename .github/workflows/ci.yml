# Continuous integration.
#
# ## The thing this workflow exists to prevent
#
# Every gate in this repository SKIPS SILENTLY when its dependency is missing, and each skip is
# a deliberate courtesy to someone running the suite on a machine without Emacs:
#
#   harness/verify-corpus.sh      no emacs or no jq          prints SKIP, exits 0
#   harness/validate-schema.sh    no python3 or jsonschema   prints SKIP, exits 0
#   OracleDiffTests               no emacs                   .enabled(if:) removes the suite
#   OracleConformanceCrossCheck   no emacs                   same
#   PinnedTableDriftTests         no emacs                   same
#   InterpretDataRoundTrip        no emacs                   same
#
# So the naive workflow -- install Swift, run the three commands, go green -- would verify almost
# nothing and say so in the same colour as a real pass. That is the exact failure mode
# validate-schema.sh guards against in its own self-test: "a gate that reports 104/104 is worth
# nothing until it has been shown able to say anything else."
#
# Hence the preflight below, which FAILS on a missing dependency instead of tolerating it, and
# the assertions that each suite actually ran. A skip here is a red.
#
# ## Why the oracle runs on macOS only
#
# The answer keys in conformance/ were generated by Emacs 30.2 / org 9.7.11. Ubuntu ships Emacs
# 29 with org 9.6, whose trees differ, so running the oracle on Linux would produce a wall of
# mismatches about the org version rather than about this parser. The Linux job therefore
# installs no Emacs at all and claims only what it proves: that the library builds and its
# pure-Swift gates pass off-Apple, which is the portability claim Package.swift makes.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `run` below is bash, stated rather than assumed. Inside the swift:6.1 container the
# default shell is `sh` (dash), which has no `set -o pipefail` -- so the first Linux run failed
# with "Illegal option -o pipefail" in the step that checks the suites ran, while the build and
# the tests it was supposed to be vouching for had both passed. An assertion that dies before it
# asserts is the failure this workflow exists to catch, and it caught its own.
defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS - every gate, oracle included
    # macos-26, not macos-15, and the reason is `PinnedTableDriftTests`. See the note on the
    # preflight's OS assertion below.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4


      - name: Install the oracle's dependencies
        run: |
          brew install emacs jq
          # A virtualenv rather than a system-wide install: recent runners ship an
          # externally-managed Python that refuses `pip install` without
          # --break-system-packages, and reaching for that flag to work around a packaging
          # policy is how a CI machine ends up in a state nobody can reproduce.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Preflight - a missing dependency is a failure, not a skip
        run: |
          set -euo pipefail
          fail=0
          for tool in emacs jq python3 swift; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "found    $tool -> $(command -v "$tool")"
            else
              echo "MISSING  $tool -- every gate depending on it would SKIP and the run would go green"
              fail=1
            fi
          done
          if python3 -c "import jsonschema" 2>/dev/null; then
            echo "found    python jsonschema"
          else
            echo "MISSING  python jsonschema -- validate-schema.sh would SKIP"
            fail=1
          fi
          # Printed, never pinned. If Homebrew's Emacs moves and org changes a tree, the right
          # signal is verify-corpus.sh failing with the diff, not this step second-guessing it.
          emacs --batch -Q --eval '(princ (concat "emacs " emacs-version " / org " (org-version)))'
          echo
          swift --version
          sw_vers
          # The OS version is asserted, and it is the one input here nobody would guess.
          #
          # `PinnedTableDriftTests` compares Swift's own Unicode case tables against Emacs's, so
          # its shipped difference sets depend on where Swift's case data comes from. On macOS
          # that is the OS, not the toolchain: the standard library has been ABI-stable and
          # OS-provided since Swift 5, so `uppercased()` answers from whatever Unicode data the
          # running macOS ships.
          #
          # Measured, and it is why this job is macos-26. `OrgParser.upcaseDeclined` lists
          # U+A7CF, U+A7D3, U+A7D5 and the U+16EBB..U+16ED3 Beria Erfe block among the scalars
          # Swift uppercases and Emacs does not. On macOS 15 those 28 do not uppercase at all, so
          # both difference-set tests failed with all 28 "in the shipped table but not the
          # regenerated data" -- IDENTICALLY under three different toolchains (6.1.2 from
          # /usr/bin, 6.2.4 from Xcode 26.3, and 6.3.3 installed from swift.org). Three
          # toolchains, one result: the toolchain was never the variable. Emacs matched exactly
          # throughout, 30.2 / org 9.7.11.
          if ! sw_vers -productVersion | grep -q '^26\.'; then
            echo "MISMATCH  expected macOS 26.x -- the OS whose Unicode data the pinned tables were built against"
            fail=1
          fi
          exit $fail

      - name: Layer 1 - the answer key still matches live Emacs
        run: |
          set -euo pipefail
          # 2>&1 is load-bearing: the SKIP notice is written to STDERR, so a log captured from
          # stdout alone would be missing the one line this step is looking for.
          bash harness/verify-corpus.sh 2>&1 | tee /tmp/verify.log
          # The script exits 0 when it skips, by design. This is what makes a skip red.
          if grep -q '^SKIP' /tmp/verify.log; then
            echo "verify-corpus.sh SKIPPED -- nothing was checked"; exit 1
          fi

      - name: Every stored answer still satisfies the published schema
        run: |
          set -euo pipefail
          bash harness/validate-schema.sh 2>&1 | tee /tmp/schema.log   # stderr, as above
          if grep -q '^SKIP' /tmp/schema.log; then
            echo "validate-schema.sh SKIPPED -- nothing was validated"; exit 1
          fi

      - name: swift test
        run: swift test 2>&1 | tee /tmp/test.log

      - name: The Emacs-backed suites actually ran
        run: |
          set -euo pipefail
          # `.enabled(if: HarnessSupport.emacsAvailable)` removes a suite from the run entirely
          # when Emacs is absent -- it is not reported as skipped, it is simply not there. So the
          # only way to know these ran is to find them by name.
          missing=0
          while IFS= read -r suite; do
            if grep -qF "$suite" /tmp/test.log; then
              echo "ran      $suite"
            else
              echo "ABSENT   $suite -- the oracle suite did not run"
              missing=1
            fi
          done <<'SUITES'
          Oracle diff against real Emacs
          oracle-dump.el regression guard
          Pinned Emacs tables have not drifted
          org-element-interpret-data round-trip
          SUITES
          exit $missing

  linux:
    name: Linux - the library builds and its pure-Swift gates pass
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      # Package.swift states the library imports nothing -- not Foundation, not Darwin -- and is
      # therefore portable everywhere Swift runs. Until this job existed that claim had never been
      # executed once. This step IS the claim.
      - name: swift build - the portability claim itself
        run: swift build

      - name: swift test - the pure-Swift gates
        run: swift test 2>&1 | tee /tmp/test.log

      - name: The non-oracle suites actually ran
        run: |
          set -euo pipefail
          # The Emacs-backed suites are absent here BY DESIGN (see the header). These are the ones
          # that must be present, or this job is green for no reason.
          missing=0
          while IFS= read -r suite; do
            if grep -qF "$suite" /tmp/test.log; then
              echo "ran      $suite"
            else
              echo "ABSENT   $suite"
              missing=1
            fi
          done <<'SUITES'
          Conformance (parser implemented case-by-case)
          Sweep (a wrong tree fails
          Nesting depth is refused
          Public API (consumed the way a user consumes it)
          Typed AST round-trip
          SUITES
          exit $missing
